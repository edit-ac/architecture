# Local GTK build host. Keep stopped outside the Linux lane on this 8 GiB Mac.
minimumLimaVersion: 2.2.1
vmType: vz
arch: aarch64
cpus: 2
memory: 2GiB
disk: 24GiB
containerd:
  system: false
  user: false
images:
  - location: https://cloud-images.ubuntu.com/releases/resolute/release-20260927/ubuntu-26.04-server-cloudimg-arm64.img
    arch: aarch64
    digest: sha256:63a93bd5a8d76e33b15ceb5daa3657bd79be804748051ab178e643b0f5da22e7
mounts: []
propagateProxyEnv: false
ssh:
  forwardAgent: false
portForwards:
  - guestPortRange: [1, 65535]
    ignore: true
env:
  CARGO_BUILD_JOBS: "1"
provision:
  - mode: system
    script: |
      #!/bin/sh
      set -eu
      export DEBIAN_FRONTEND=noninteractive
      apt-get update
      apt-get install -y --no-install-recommends build-essential pkg-config libgtk-4-dev libadwaita-1-dev at-spi2-core xvfb xauth dbus-x11 ca-certificates curl
